[project]
name = "pid-calculator"
version = "1.0.0"
description = "Веб-приложение для автоматической настройки ПИД-регуляторов по данным процесса (CSV)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0",
    "python-dotenv>=1.0",
    "pandas>=2.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "reportlab>=4.0",
    "openpyxl>=3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Приложение запускается из исходников, пакетная сборка не требуется
bypass-selection = true
